name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "policy-library/**"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two applies for the same branch at the same time.
concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

# dev is applied first; prod only after dev succeeded and (because of the
# prod environment's protection rules) after a reviewer approved it.
jobs:
  dev:
    uses: ./.github/workflows/terraform-apply-env.yml
    permissions:
      contents: read
      id-token: write # a called workflow can't have more permissions than its caller
    with:
      environment: dev

  prod:
    needs: dev
    uses: ./.github/workflows/terraform-apply-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
