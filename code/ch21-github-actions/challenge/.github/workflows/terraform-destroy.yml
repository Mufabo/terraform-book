name: terraform-destroy

# Started by hand only: Actions → terraform-destroy → Run workflow.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy.
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: Type the environment name again to confirm.
        required: true
        type: string

permissions:
  contents: read

# Never run at the same time as an apply or another destroy on main.
concurrency:
  group: terraform-apply-refs/heads/main
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    # Same GitHub environment as the apply job: prod waits for a reviewer,
    # and the OIDC token carries the environment claim Google checks.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    env:
      TF_VERSION: "1.17.0"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Check the confirmation
        working-directory: .
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match '$ENVIRONMENT'."
            exit 1
          fi

      - name: Only from main
        working-directory: .
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch."
          exit 1

      - uses: actions/checkout@v7.0.1

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.environment == 'prod' && vars.GCP_APPLY_SA_PROD || vars.GCP_APPLY_SA_DEV }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan -destroy
        run: |
          terraform plan -destroy -lock-timeout=300s -out=tfplan -no-color | tee plan.txt
          {
            echo "### Destroy plan for ${{ inputs.environment }}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (destroy)
        run: terraform apply -lock-timeout=300s tfplan
