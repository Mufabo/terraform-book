apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: tfstoragebucketpublicaccesspreventionconstraintv1
spec:
  crd:
    spec:
      names:
        kind: TFStorageBucketPublicAccessPreventionConstraintV1
      validation:
        openAPIV3Schema:
          properties: {}
  targets:
    - target: validation.resourcechange.terraform.cloud.google.com
      rego: |
        package templates.gcp.TFStorageBucketPublicAccessPreventionConstraintV1

        violation[{
          "msg": message,
          "details": metadata,
        }] {
          resource := input.review
          resource.type == "google_storage_bucket"
          is_object(resource.change.after)
          not resource.change.after.public_access_prevention == "enforced"

          message := sprintf("%s: public_access_prevention must be set to \"enforced\"", [resource.address])
          metadata := {"resource": resource.address}
        }
