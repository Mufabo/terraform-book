apiVersion: constraints.gatekeeper.sh/v1beta1
kind: GCPIAMBannedMembersConstraintV1
metadata:
  name: no-public-cloud-run
spec:
  severity: high
  match:
    ancestries:
      - "**"
  parameters:
    asset_types:
      - run.googleapis.com/Service
    banned_members:
      - allUsers
      - allAuthenticatedUsers
