apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: tfrequiredlabelsconstraintv1
spec:
  crd:
    spec:
      names:
        kind: TFRequiredLabelsConstraintV1
      validation:
        openAPIV3Schema:
          properties:
            resource_types:
              description: Terraform resource types to check, e.g. google_storage_bucket.
              type: array
              items:
                type: string
            required_labels:
              description: Label keys that must be present.
              type: array
              items:
                type: string
  targets:
    - target: validation.resourcechange.terraform.cloud.google.com
      rego: |
        package templates.gcp.TFRequiredLabelsConstraintV1

        violation[{
          "msg": message,
          "details": metadata,
        }] {
          resource := input.review
          resource.type == input.parameters.resource_types[_]
          is_object(resource.change.after)
          labels := get_labels(resource.change.after)
          required := input.parameters.required_labels[_]
          not labels[required]

          message := sprintf("%s: missing required label %q", [resource.address, required])
          metadata := {"resource": resource.address, "missing_label": required}
        }

        get_labels(after) = labels {
          labels := after.labels
          is_object(labels)
        } else = {}
