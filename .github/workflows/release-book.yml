name: Build and release book

# Pull requests that touch the book build and validate the EPUB. Pushing a tag
# like v1.0.0 also publishes it as a GitHub release.
on:
  pull_request:
    paths:
      - "book/**"
      - "epub/**"
      - ".github/workflows/release-book.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PANDOC_VERSION: "3.13"
  PANDOC_SHA256: 7e3736f255090296ca5d1a14291a76b9b3c43cd385011b1621a4d0c16091a70f
  EPUBCHECK_VERSION: "5.4.0"
  EPUBCHECK_SHA256: 33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      epub: ${{ steps.build.outputs.epub }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pandoc
        run: |
          curl -sSfL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  pandoc.deb" | sha256sum --check
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Build EPUB
        id: build
        env:
          REPO_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          epub="terraform-on-google-cloud-${version}.epub"
          epub/build.sh "$epub" "$version"
          echo "epub=$epub" >> "$GITHUB_OUTPUT"

      - name: Validate EPUB
        run: |
          curl -sSfL -o epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          echo "${EPUBCHECK_SHA256}  epubcheck.zip" | sha256sum --check
          unzip -q epubcheck.zip
          java -jar "epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" "${{ steps.build.outputs.epub }}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: epub
          path: ${{ steps.build.outputs.epub }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: epub

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          EPUB: ${{ needs.build.outputs.epub }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$EPUB" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Introduction to Terraform on Google Cloud ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
